# [structure_ratchet] -- baseline-and-ratchet layout stage. scripts/verify-before-ship.ps1
# runs scripts/structure_ratchet.py, which fails when a new file passes 1,000 lines, a
# new function 100 lines or a flat directory 40 modules, when a baselined offender grows
# past its size in .structure-ratchet-baseline.json, when src/ imports app/, and when the
# root folders do not match `shape` plus `extra_roots`. Offenders are baselined at today's
# size, never excluded. Exit 3 (git unusable, an unparseable file) fails the gate.
self_restart = { src = "src/self_restart.py", sha = "48602060fffdacbcdcdde66b9886c6471d835ff3", dest = "src/self_restart.py" }
build_info = { src = "src/build_info.py", sha = "1c1007fcd0b65b54342779250cb66975d57482e8", dest = "src/build_info.py" }
health_routes = { src = "src/health_routes.py", sha = "732c304a4735d4e654f5acb3b6f53b7db67d47ef", dest = "src/health_routes.py" }
restart_check = { src = "src/restart_check.py", sha = "f8c2f66eae7a69f3c834386579702ed5b747d7af", dest = "src/restart_check.py" }
ratchet_baseline = { src = "scripts/ratchet_baseline.py", sha = "48db2132dab2dfc38b6154948ca17fd1f4b9232f", dest = "scripts/ratchet_baseline.py" }
ps_script = { src = "src/ps_script.py", sha = "2d786d295c9b8d545aaf35703889638096f251ad", dest = "src/ps_script.py" }

[structure_ratchet]
enabled  = true
baseline = ".ratchets/structure.json"

# [instruction_ratchet] -- baseline-and-ratchet stage for the instruction files
# (CLAUDE.md, AGENTS.md, .claude/rules, SKILL.md): the lint-tier prompt-audit rules and
# the size caps. scripts/verify-before-ship.ps1 runs scripts/instruction_ratchet.py,
# which fails when a per-file rule count rises above .instruction-ratchet-baseline.json
# or a file passes its cap. Existing hits are baselined, never excluded. Exit 3
# (git unusable, an unreadable file) fails the gate.
[instruction_ratchet]
enabled  = true
baseline = ".ratchets/instruction.json"

# [doc_refs_ratchet] -- baseline-and-ratchet stage for dangling documentation references:
# README.md, CLAUDE.md and docs/**/*.md naming a repo path, `python -m` module, relative
# link or loopback port that does not exist. scripts/verify-before-ship.ps1 runs
# scripts/doc_refs_ratchet.py, which fails on a dangling reference not recorded in
# .doc-refs-ratchet-baseline.json. The app's own port comes from `port` above; list any
# other service's port or intentional pointer in `allow_refs`. Exit 3 (git unusable, an
# unreadable file) fails the gate.
ci_expectations = true
agents_pointer = true
repeated_text_words = 12
claude_md_max_lines = 120
[doc_refs_ratchet]
enabled    = true
trees    = true
baseline   = ".ratchets/doc-refs.json"
allow_refs = []

# [dead_code_ratchet] -- baseline-and-ratchet stage for unreferenced Python definitions:
# a function, class or method nothing in the tracked tree names. scripts/verify-before-ship.ps1
# runs scripts/dead_code_ratchet.py, which fails on a dead definition not recorded in
# .dead-code-ratchet-baseline.json. Route handlers, dunder names, tests and `[vendored]`
# files are never reported; list any other framework hook in `allow` / `entry_decorators`.
# Exit 3 (git unusable, a file that does not parse) fails the gate.
[dead_code_ratchet]
enabled  = true
baseline = ".ratchets/dead-code.json"

# [static_ratchet] -- baseline-and-ratchet stage for duplicated blocks (jscpd, Python and JS),
# unused imports/variables and likely-bug/security patterns (ruff). scripts/verify-before-ship.ps1
# runs scripts/static_ratchet.py, which fails on a finding not recorded in
# .static-ratchet-baseline.json. Needs Node (npx) and ruff in the gate's venv. The vendored
# front-end libraries under app/webapp/static/vendor/ are third-party copies, so they are
# excluded; the `[vendored]` scripts are left out automatically. Exit 3 (a detector could not
# run) fails the gate.
[static_ratchet]
enabled  = true
baseline = ".ratchets/static.json"
exclude  = ["app/webapp/static/vendor/**"]

# [docs_ratchet] -- baseline-and-ratchet stage for the README/docs convention: the size of the
# root README.md and the history markers (issue references, dated and changelog headings) in
# README.md and docs/**/*.md. scripts/verify-before-ship.ps1 runs scripts/docs_ratchet.py, which
# fails when either rises above .docs-ratchet-baseline.json. Needs Python 3.11+ (tomllib). Exit 3
# (git unusable, a file that is not UTF-8, a fence or comment that never closes) fails the gate.
[docs_ratchet]
enabled  = true
baseline = ".ratchets/docs.json"

# [comment_ratchet] -- baseline-and-ratchet stage for issue references in product-code comments
# (Python, JS, CSS, PowerShell): a comment states why the code is the way it is now, history lives in
# the issue and git log. scripts/verify-before-ship.ps1 runs scripts/comment_ratchet.py, which fails
# when a file's `#NNN` count rises above .comment-ratchet-baseline.json. Tests and `[vendored]` files
# are left out automatically. Needs Python 3.11+ (tomllib). Exit 3 (git unusable, a file that cannot
# be scanned) fails the gate.
[comment_ratchet]
enabled  = true
baseline = ".ratchets/comment.json"

# [conventions_ratchet] -- baseline-and-ratchet stage for fleet conventions held as stdlib `ast`
# rules over the tracked Python files. scripts/verify-before-ship.ps1 runs
# scripts/conventions_ratchet.py, which fails when a file's hit count for a rule rises above
# .conventions-ratchet-baseline.json. Rules on: `no-window` (the tray spawns child processes on
# Windows), `logging-not-print` (app/ and src/ log through `logging`) and `no-drive-path` (no
# hardcoded drive paths), `subprocess-timeout` (every subprocess call passes a `timeout=` or carries a `# subprocess-timeout-exempt: <reason>` marker), plus `must-use` for the entry below (a `StaticFiles` mount outside
# `src/static_versioning.py` fails). Rules off: `secret-compare` and `git-wrapper`, because this
# repo has neither helper. Needs Python 3.11+ (tomllib). Exit 3 (git unusable, a file that does not
# parse) fails the gate.
docstrings = true
history_phrases = true
[conventions_ratchet]
enabled  = true
baseline = ".ratchets/conventions.json"
rules    = ["no-window", "logging-not-print", "no-drive-path", "must-use", "state-literal", "state-set-repeat", "state-write", "subprocess-timeout", "browser-per-iteration", "path-sep"]

# Static files go through the cache-busting mount, never a bare StaticFiles.
[[conventions_ratchet.must_use]]
call   = ["fastapi.staticfiles.StaticFiles", "starlette.staticfiles.StaticFiles"]
helper = ["src/static_versioning.py"]
why    = "CLAUDE.md: static assets go through CachingStaticFiles"

# Each SQLite database has one connection home: the usage log for its own store,
# cli_session_store for the read-only Copilot CLI database, read_model for the persisted
# parsed records. Any other sqlite3.connect fails.
[[conventions_ratchet.must_use]]
call   = ["sqlite3.connect"]
helper = ["src/usage_log.py", "src/cli_session_store.py", "src/read_model.py"]
why    = "one connection helper per database: the usage log's store, the read-only CLI session store and the read model"

# [runtime_write_ratchet] -- scripts/runtime_write_ratchet.py fails when a tracked
# Python file gains a write target (open for writing, Path.write_*, mkdir, a log
# FileHandler, sqlite3.connect, a copy destination) whose path resolves under a code
# folder, beyond .runtime-write-ratchet-baseline.json; a new target it cannot resolve
# is "not confirmed" (exit 3), never clean. The same script brackets the test stages
# (--snapshot before, --probe after) and fails on any untracked or ignored file the
# run left under a code folder. Mechanism: project-scaffolding docs/runtime-write-ratchet.md.
[runtime_write_ratchet]
enabled  = true
baseline = ".ratchets/runtime-write.json"

# [usage_track_ratchet] -- scripts/usage_track_ratchet.py (with its reader
# scripts/usage_track_scan.py) fails when the web app's HTML or JS gains a control with no
# constant `data-track` id, a <dialog> with no `data-track-view`, or a tracking id built at
# run time, beyond .usage-track-ratchet-baseline.json; `usage-log-wired` also fails, never
# baselined, when the app does not vendor, start and mount its usage log. Exit 3 is "not
# confirmed", never clean. Mechanism: project-scaffolding docs/usage-track-ratchet.md.
[usage_track_ratchet]
enabled  = true
baseline = ".ratchets/usage-track.json"
rules    = ["untracked-control", "untracked-sheet", "dynamic-id", "usage-log-wired", "health-routes-wired"]

# [ux_surface_ratchet] -- scripts/ux_surface_ratchet.py fails when the web app's HTML or JS gains a
# surface root (a <dialog>, a dialog/menu/tabpanel role, a popover) with no constant
# `data-surface` id, an id with no entry in docs/ux-surfaces.yaml, a map entry no element
# carries, one id on two surfaces, a link to an id with no entry, or a docs/ux-surface-map.md page
# not regenerated from the map, beyond .ux-surface-ratchet-baseline.json. Exit 3 is
# "not confirmed", never clean. Mechanism: project-scaffolding docs/ux-surface-ratchet.md.
[ux_surface_ratchet]
enabled  = true
baseline = ".ratchets/ux-surface.json"
map      = "docs/ux-surfaces.yaml"
exclude  = ["app/webapp/static/vendor/**"]

# [[state_machines]] -- a lifecycle declared in one module with one derive function; the
# conventions ratchet's state rules never report the owner module. Mechanism:
# project-scaffolding docs/implicit-state-machines.md. See docs/billing-state.md.
[[state_machines]]
name   = "billing"
module = "src/billing_state.py"
type   = "BillingState"
derive = "derive"

# [e2e] -- the standing browser suite is the contract for the single-page UI: one phone-sized
# run per behaviour (the tab test also checks a desktop width, one test checks both themes). The
# budget holds it at today's size: lower it when a test is trimmed, never raise it without a reason.
# 20 is the count after the same-flow tests were merged: each remaining test owns a surface no other
# one drives (rename, start date, card fold, trend, tabs, refresh toast, four feature switches, the
# request explorer's filters, history and pagination, the session sheet, the stale-tab refresh).
# The 21st is the runtime request-budget check (tests/e2e/budget), the only test that counts the
# page's requests over a visible and a hidden minute.
# junit_xml holds the per-test seconds /e2e-audit reads. The gate overwrites it on each run; it sits
# in pytest's own cache folder, git-ignored and outside every code folder.
[e2e]
test_budget = 21
junit_xml   = ".pytest_cache/e2e-junit.xml"

# Routing rules for scripts/classify_e2e.py, first match wins; a path no rule matches runs the full suite.
[[e2e.rule]]
tier   = "full"
prefix = "app/"

[[e2e.rule]]              # prose outside the app is never rendered by it
tier       = "none"
extensions = ["md"]

# [[design.accepted]] -- a design_lint finding this repo has judged and keeps. The icon family
# is committed and linked; this public repo generates it with the standalone Pillow-only
# scripts/gen_icons.py because it may not depend on another repo's brand_gen.
[[design.accepted]]
check  = "app-icon-family"
target = "app/webapp/static/index.html"
detail = "shared brand_gen.render_set generator not adopted"
reason = "public standalone repo: scripts/gen_icons.py generates the same icon family without importing another repo's generator"

[[design.accepted]]
check  = "glyph-icons"
reason = "the one remaining arrow is the 'Settings → …' path in prose copy, the same wording the docs use; it is not drawn as an icon"

[[design.accepted]]
check  = "hit-target"
reason = ".model-dot is a decorative 10px colour swatch in a table cell, not a pointer target, so the 44px floor does not apply"

# [request_budget_ratchet] -- scripts/request_budget_ratchet.py (with its reader
# scripts/request_budget_scan.py) fails when a file's count for a request-budget rule rises above
# .request-budget-ratchet-baseline.json: a fixed-rate browser poll that reaches the server, a poll
# under 2 s, an undeclared fast or subprocess-spawning server loop, a use of the default thread
# pool, or a web app without the request-timing middleware. `scan-per-request` is OFF: the
# handlers live in the single module app/server.py, not a dedicated handler folder, so no
# `handler_dirs` is declared. Exit 3 is "not confirmed", never clean. Mechanism:
# project-scaffolding docs/request-budget-ratchet.md.
[request_budget_ratchet]
enabled  = true
baseline = ".ratchets/request-budget.json"

# Measured on the main page: two 30 s refresh polls of three reads each, the one-time boot reads that
# can land in the window (config, version, billing, tailnet, health check, restart) and the usage
# log's 10 s flush make 13 at most; a quieter minute reads 4.
[request_budget]
visible_requests_per_minute = 13

# The pace alert is the one loop that must run while no page is open: it messages the owner when the
# cycle projection reaches the allowance, which only matters when nobody is looking at the dashboard.
[[request_budget.loops]]
path       = "app/server.py"
function   = "_pace_alert_loop"
interval_s = 1800
why        = "sends the owner a message when the cycle projection reaches the allowance, while no page is open"

# The tailnet certificate check wakes once a day to renew it; the listener has no viewer to wait for.
[[request_budget.loops]]
path       = "app/listeners.py"
function   = "Listeners._wait_for_renewal"
interval_s = 86400
why        = "renews the tailnet certificate before it expires, whether or not a page is open"

# [install_standard_ratchet] -- scripts/verify-before-ship.ps1 runs
# scripts/install_standard_ratchet.py, which fails when an installer module is missing, undeclared or
# behind the scaffold's, [install.migrate] does not parse, or docs/install.md lacks its Install, Update
# or Migrate section.
[install_standard_ratchet]
enabled  = true
baseline = ".ratchets/install-standard.json"

# [install] -- what setup.bat (src/installer.py) does on a fresh clone or an existing PC.
# Schema: project-scaffolding docs/installer.md. config.json is a settings file: created from
# config.example.json when missing, and on an existing one only the keys it lacks are added, after a
# backup. .env is the PC's own secrets and is created empty from .env.example, never rewritten. The
# app has no config/ folder, so no sample is picked up by convention.
[install]
requirements = "requirements.txt"
samples      = []
settings     = ["config.json"]

[[install.config]]
sample = "config.example.json"
target = "config.json"

[[install.config]]
sample = ".env.example"
target = ".env"

# [install.endpoint] and [install.migrate] are what `setup.bat -InPlace` and `-MigrateFrom` read. The
# server is plain HTTP on loopback; the port is the top-level `port` unless this PC's config.json sets
# one. Only config.json and .env are this PC's own files inside the checkout. The runtime-data folder
# (read model, usage log, pace-alert state, Tailscale certificate) is outside it and stays in place.
[install.endpoint]
scheme       = "http"
version_path = "/api/version"
self_signed  = false
port_config  = "config.json"

[install.migrate]
copy    = ["config.json", ".env"]
secrets = [".env"]
shared  = ["github-copilot-usage"]

# No [install.startup]: the tray has no register command, so log-on start is a shortcut to tray.bat in shell:startup.

[[install.check]]
name    = "Copilot session logs"
level   = "optional"
blocks  = "usage figures on the dashboard"
command = ["{python}", "-c", "import sys; from src import discovery; sys.exit(0 if discovery.discover_roots() or discovery.copilot_cli_dir() else 1)"]
hint    = "use GitHub Copilot in VS Code or the Copilot CLI on this PC, or add another PC's workspaceStorage under Settings > Extra storage roots"

[[install.check]]
name   = "Tailscale CLI"
level  = "optional"
blocks = "phone access"
which  = "tailscale"
hint   = "only needed to open the dashboard from a phone: install Tailscale, then turn on Settings > Available features > Tailscale access"
