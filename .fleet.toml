# .fleet.toml -- this repo's card on the fleet architecture map. Keep it current:
# update it in the same PR as any material change (layer, port, role, one-line
# description, exposed services).
layer       = "working-web"
icon        = "📊"
port        = ":8377"
description = "Local GitHub Copilot usage dashboard: credits, models and sessions from Copilot's own logs."
shape       = "webapp-tray"
# `static/` moved under app/webapp/, so the front end needs no extra root folder.
extra_roots = []

# [vendored] -- components copied byte-for-byte from project-scaffolding, with the
# scaffold commit each came from. Re-vendor from there, never edit the copy.
[vendored]
usage-log = { src = "app/webapp/static/_vendored/usage-log", sha = "6c8ae06472edc4c7448a767656060cd2b79cefe9", dest = "app/webapp/static/_vendored/usage-log" }
usage_log = { src = "src/usage_log.py", sha = "ea11037a42f9f99ea8e728f574c6bb89480f3aa2", dest = "src/usage_log.py" }
runtime_data = { src = "src/runtime_data.py", sha = "ea11037a42f9f99ea8e728f574c6bb89480f3aa2", dest = "src/runtime_data.py" }
usage_track_ratchet = { src = "scripts/usage_track_ratchet.py", sha = "ea11037a42f9f99ea8e728f574c6bb89480f3aa2", dest = "scripts/usage_track_ratchet.py" }
usage_track_scan = { src = "scripts/usage_track_scan.py", sha = "ea11037a42f9f99ea8e728f574c6bb89480f3aa2", dest = "scripts/usage_track_scan.py" }
structure_ratchet = { src = "scripts/structure_ratchet.py", sha = "bf11a867c5678c6a4869a6265bf6cecf1d12d1a2", dest = "scripts/structure_ratchet.py" }
structure_layout = { src = "scripts/structure_layout.py", sha = "bf11a867c5678c6a4869a6265bf6cecf1d12d1a2", dest = "scripts/structure_layout.py" }
structure_band = { src = "scripts/structure_band.py", sha = "3b708fd3c54ab7b93b08d489406c405762c83c41", dest = "scripts/structure_band.py" }
box_lock_gate = { src = "scripts/box_lock_gate.ps1", sha = "98cdb1b7727d12a5c233580478e6fae40d98e6f3", dest = "scripts/box_lock_gate.ps1" }
instruction_ratchet = { src = "scripts/instruction_ratchet.py", sha = "5505185c5f4b10eea5ab268e7b6676c6c54340c4", dest = "scripts/instruction_ratchet.py" }
doc_refs_ratchet = { src = "scripts/doc_refs_ratchet.py", sha = "dedb86e0f212d66f247f4aacb6c15d13b1154651", dest = "scripts/doc_refs_ratchet.py" }
dead_code_ratchet = { src = "scripts/dead_code_ratchet.py", sha = "5505185c5f4b10eea5ab268e7b6676c6c54340c4", dest = "scripts/dead_code_ratchet.py" }
static_ratchet = { src = "scripts/static_ratchet.py", sha = "5505185c5f4b10eea5ab268e7b6676c6c54340c4", dest = "scripts/static_ratchet.py" }
docs_ratchet = { src = "scripts/docs_ratchet.py", sha = "5505185c5f4b10eea5ab268e7b6676c6c54340c4", dest = "scripts/docs_ratchet.py" }
comment_ratchet = { src = "scripts/comment_ratchet.py", sha = "41ca8abd5a2755a06bd8a620a72967211161d58e", dest = "scripts/comment_ratchet.py" }
conventions_ratchet = { src = "scripts/conventions_ratchet.py", sha = "39ae7582b35fe8ef05441bb5cba65c38b0dfad3f", dest = "scripts/conventions_ratchet.py" }
conventions_readers = { src = "scripts/conventions_readers.py", sha = "39ae7582b35fe8ef05441bb5cba65c38b0dfad3f", dest = "scripts/conventions_readers.py" }
runtime_write_ratchet = { src = "scripts/runtime_write_ratchet.py", sha = "5505185c5f4b10eea5ab268e7b6676c6c54340c4", dest = "scripts/runtime_write_ratchet.py" }
runtime_write_resolve = { src = "scripts/runtime_write_resolve.py", sha = "5505185c5f4b10eea5ab268e7b6676c6c54340c4", dest = "scripts/runtime_write_resolve.py" }
page-foot = { src = "app/webapp/static/_vendored/page-foot", sha = "35c1f11348e100fa6b5da487411424c6d6ced43c", dest = "app/webapp/static/_vendored/page-foot" }

# [structure_ratchet] -- baseline-and-ratchet layout stage. scripts/verify-before-ship.ps1
# runs scripts/structure_ratchet.py, which fails when a new file passes 1,000 lines, a
# new function 100 lines or a flat directory 40 modules, when a baselined offender grows
# past its size in .structure-ratchet-baseline.json, when src/ imports app/, and when the
# root folders do not match `shape` plus `extra_roots`. Offenders are baselined at today's
# size, never excluded. Exit 3 (git unusable, an unparseable file) fails the gate.
[structure_ratchet]
enabled  = true
baseline = ".structure-ratchet-baseline.json"

# [instruction_ratchet] -- baseline-and-ratchet stage for the instruction files
# (CLAUDE.md, AGENTS.md, .claude/rules, SKILL.md): the lint-tier prompt-audit rules and
# the size caps. scripts/verify-before-ship.ps1 runs scripts/instruction_ratchet.py,
# which fails when a per-file rule count rises above .instruction-ratchet-baseline.json
# or a file passes its cap. Existing hits are baselined, never excluded. Exit 3
# (git unusable, an unreadable file) fails the gate.
[instruction_ratchet]
enabled  = true
baseline = ".instruction-ratchet-baseline.json"

# [doc_refs_ratchet] -- baseline-and-ratchet stage for dangling documentation references:
# README.md, CLAUDE.md and docs/**/*.md naming a repo path, `python -m` module, relative
# link or loopback port that does not exist. scripts/verify-before-ship.ps1 runs
# scripts/doc_refs_ratchet.py, which fails on a dangling reference not recorded in
# .doc-refs-ratchet-baseline.json. The app's own port comes from `port` above; list any
# other service's port or intentional pointer in `allow_refs`. Exit 3 (git unusable, an
# unreadable file) fails the gate.
[doc_refs_ratchet]
enabled    = true
baseline   = ".doc-refs-ratchet-baseline.json"
allow_refs = []

# [dead_code_ratchet] -- baseline-and-ratchet stage for unreferenced Python definitions:
# a function, class or method nothing in the tracked tree names. scripts/verify-before-ship.ps1
# runs scripts/dead_code_ratchet.py, which fails on a dead definition not recorded in
# .dead-code-ratchet-baseline.json. Route handlers, dunder names, tests and `[vendored]`
# files are never reported; list any other framework hook in `allow` / `entry_decorators`.
# Exit 3 (git unusable, a file that does not parse) fails the gate.
[dead_code_ratchet]
enabled  = true
baseline = ".dead-code-ratchet-baseline.json"

# [static_ratchet] -- baseline-and-ratchet stage for duplicated blocks (jscpd, Python and JS),
# unused imports/variables and likely-bug/security patterns (ruff). scripts/verify-before-ship.ps1
# runs scripts/static_ratchet.py, which fails on a finding not recorded in
# .static-ratchet-baseline.json. Needs Node (npx) and ruff in the gate's venv. The vendored
# front-end libraries under app/webapp/static/vendor/ are third-party copies, so they are
# excluded; the `[vendored]` scripts are left out automatically. Exit 3 (a detector could not
# run) fails the gate.
[static_ratchet]
enabled  = true
baseline = ".static-ratchet-baseline.json"
exclude  = ["app/webapp/static/vendor/**"]

# [docs_ratchet] -- baseline-and-ratchet stage for the README/docs convention: the size of the
# root README.md and the history markers (issue references, dated and changelog headings) in
# README.md and docs/**/*.md. scripts/verify-before-ship.ps1 runs scripts/docs_ratchet.py, which
# fails when either rises above .docs-ratchet-baseline.json. Needs Python 3.11+ (tomllib). Exit 3
# (git unusable, a file that is not UTF-8, a fence or comment that never closes) fails the gate.
[docs_ratchet]
enabled  = true
baseline = ".docs-ratchet-baseline.json"

# [comment_ratchet] -- baseline-and-ratchet stage for issue references in product-code comments
# (Python, JS, CSS, PowerShell): a comment states why the code is the way it is now, history lives in
# the issue and git log. scripts/verify-before-ship.ps1 runs scripts/comment_ratchet.py, which fails
# when a file's `#NNN` count rises above .comment-ratchet-baseline.json. Tests and `[vendored]` files
# are left out automatically. Needs Python 3.11+ (tomllib). Exit 3 (git unusable, a file that cannot
# be scanned) fails the gate.
[comment_ratchet]
enabled  = true
baseline = ".comment-ratchet-baseline.json"

# [conventions_ratchet] -- baseline-and-ratchet stage for fleet conventions held as stdlib `ast`
# rules over the tracked Python files. scripts/verify-before-ship.ps1 runs
# scripts/conventions_ratchet.py, which fails when a file's hit count for a rule rises above
# .conventions-ratchet-baseline.json. Rules on: `no-window` (the tray spawns child processes on
# Windows), `logging-not-print` (app/ and src/ log through `logging`) and `no-drive-path` (no
# hardcoded drive paths), plus `must-use` for the entry below (a `StaticFiles` mount outside
# `src/static_versioning.py` fails). Rules off: `secret-compare` and `git-wrapper`, because this
# repo has neither helper. Needs Python 3.11+ (tomllib). Exit 3 (git unusable, a file that does not
# parse) fails the gate.
[conventions_ratchet]
enabled  = true
baseline = ".conventions-ratchet-baseline.json"
rules    = ["no-window", "logging-not-print", "no-drive-path", "must-use"]

# Static files go through the cache-busting mount, never a bare StaticFiles.
[[conventions_ratchet.must_use]]
call   = ["fastapi.staticfiles.StaticFiles", "starlette.staticfiles.StaticFiles"]
helper = ["src/static_versioning.py"]
why    = "CLAUDE.md: static assets go through CachingStaticFiles"

# [runtime_write_ratchet] -- scripts/runtime_write_ratchet.py fails when a tracked
# Python file gains a write target (open for writing, Path.write_*, mkdir, a log
# FileHandler, sqlite3.connect, a copy destination) whose path resolves under a code
# folder, beyond .runtime-write-ratchet-baseline.json; a new target it cannot resolve
# is "not confirmed" (exit 3), never clean. The same script brackets the test stages
# (--snapshot before, --probe after) and fails on any untracked or ignored file the
# run left under a code folder. Mechanism: project-scaffolding docs/runtime-write-ratchet.md.
[runtime_write_ratchet]
enabled  = true
baseline = ".runtime-write-ratchet-baseline.json"

# [usage_track_ratchet] -- scripts/usage_track_ratchet.py (with its reader
# scripts/usage_track_scan.py) fails when the web app's HTML or JS gains a control with no
# constant `data-track` id, a <dialog> with no `data-track-view`, or a tracking id built at
# run time, beyond .usage-track-ratchet-baseline.json; `usage-log-wired` also fails, never
# baselined, when the app does not vendor, start and mount its usage log. Exit 3 is "not
# confirmed", never clean. Mechanism: project-scaffolding docs/usage-track-ratchet.md.
[usage_track_ratchet]
enabled  = true
baseline = ".usage-track-ratchet-baseline.json"
rules    = ["untracked-control", "untracked-sheet", "dynamic-id", "usage-log-wired"]

# [[design.accepted]] -- a design_lint finding that is accurate but whose proposed fix is wrong
# for this repo, recorded once so /design-sync does not re-file it.
[[design.accepted]]
check  = "nav-contract"
detail = "nav contract partially present — missing: standalone 100lvh bar anchor (.tabs, bottom: auto)"
reason = "single-view dashboard: the only <nav> is the period segmented control, so there is no bottom-tab bar to anchor; _vendored/nav/ is adopted if a second top-level view appears"
