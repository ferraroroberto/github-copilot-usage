# .fleet.toml -- this repo's card on the fleet architecture map. Keep it current:
# update it in the same PR as any material change (layer, port, role, one-line
# description, exposed services).
layer       = "working-web"
icon        = "📊"
port        = ":8377"
description = "Local-only GitHub Copilot usage dashboard: credits, models and sessions from Copilot's own logs."
shape       = "webapp-tray"
# `static/` moved under app/webapp/, so the front end needs no extra root folder.
extra_roots = []

# [vendored] -- components copied byte-for-byte from project-scaffolding, with the
# scaffold commit each came from. Re-vendor from there, never edit the copy.
[vendored]
structure_ratchet = { src = "scripts/structure_ratchet.py", sha = "98cdb1b7727d12a5c233580478e6fae40d98e6f3", dest = "scripts/structure_ratchet.py" }
box_lock_gate = { src = "scripts/box_lock_gate.ps1", sha = "98cdb1b7727d12a5c233580478e6fae40d98e6f3", dest = "scripts/box_lock_gate.ps1" }
instruction_ratchet = { src = "scripts/instruction_ratchet.py", sha = "60fdd0350f18d28838428b2e773f7868f6381fbf", dest = "scripts/instruction_ratchet.py" }
doc_refs_ratchet = { src = "scripts/doc_refs_ratchet.py", sha = "23dbefa46635c952d3c871bda4e80b740e7f2859", dest = "scripts/doc_refs_ratchet.py" }
dead_code_ratchet = { src = "scripts/dead_code_ratchet.py", sha = "0eb0da42298e391fc614b3fe550bd6cf2d07c693", dest = "scripts/dead_code_ratchet.py" }
static_ratchet = { src = "scripts/static_ratchet.py", sha = "537cf3931b57e7453ed251850c0dbeac042b03bf", dest = "scripts/static_ratchet.py" }
docs_ratchet = { src = "scripts/docs_ratchet.py", sha = "fdb750461997c4a13eacea8091f115ff12bba564", dest = "scripts/docs_ratchet.py" }
comment_ratchet = { src = "scripts/comment_ratchet.py", sha = "e56308e1c099712cf5a006557c94e3f9ae4fe8aa", dest = "scripts/comment_ratchet.py" }
conventions_ratchet = { src = "scripts/conventions_ratchet.py", sha = "0eb0da42298e391fc614b3fe550bd6cf2d07c693", dest = "scripts/conventions_ratchet.py" }

# [structure_ratchet] -- baseline-and-ratchet layout stage. scripts/verify-before-ship.ps1
# runs scripts/structure_ratchet.py, which fails when a new file passes 1,000 lines, a
# new function 100 lines or a flat directory 40 modules, when a baselined offender grows
# past its size in .structure-ratchet-baseline.json, when src/ imports app/, and when the
# root folders do not match `shape` plus `extra_roots`. Offenders are baselined at today's
# size, never excluded. Exit 3 (git unusable, an unparseable file) fails the gate.
[structure_ratchet]
enabled  = true
baseline = ".structure-ratchet-baseline.json"

# [instruction_ratchet] -- baseline-and-ratchet stage for the instruction files
# (CLAUDE.md, AGENTS.md, .claude/rules, SKILL.md): the lint-tier prompt-audit rules and
# the size caps. scripts/verify-before-ship.ps1 runs scripts/instruction_ratchet.py,
# which fails when a per-file rule count rises above .instruction-ratchet-baseline.json
# or a file passes its cap. Existing hits are baselined, never excluded. Exit 3
# (git unusable, an unreadable file) fails the gate.
[instruction_ratchet]
enabled  = true
baseline = ".instruction-ratchet-baseline.json"

# [doc_refs_ratchet] -- baseline-and-ratchet stage for dangling documentation references:
# README.md, CLAUDE.md and docs/**/*.md naming a repo path, `python -m` module, relative
# link or loopback port that does not exist. scripts/verify-before-ship.ps1 runs
# scripts/doc_refs_ratchet.py, which fails on a dangling reference not recorded in
# .doc-refs-ratchet-baseline.json. The app's own port comes from `port` above; list any
# other service's port or intentional pointer in `allow_refs`. Exit 3 (git unusable, an
# unreadable file) fails the gate.
[doc_refs_ratchet]
enabled    = true
baseline   = ".doc-refs-ratchet-baseline.json"
allow_refs = []

# [dead_code_ratchet] -- baseline-and-ratchet stage for unreferenced Python definitions:
# a function, class or method nothing in the tracked tree names. scripts/verify-before-ship.ps1
# runs scripts/dead_code_ratchet.py, which fails on a dead definition not recorded in
# .dead-code-ratchet-baseline.json. Route handlers, dunder names, tests and `[vendored]`
# files are never reported; list any other framework hook in `allow` / `entry_decorators`.
# Exit 3 (git unusable, a file that does not parse) fails the gate.
[dead_code_ratchet]
enabled  = true
baseline = ".dead-code-ratchet-baseline.json"

# [static_ratchet] -- baseline-and-ratchet stage for duplicated blocks (jscpd, Python and JS),
# unused imports/variables and likely-bug/security patterns (ruff). scripts/verify-before-ship.ps1
# runs scripts/static_ratchet.py, which fails on a finding not recorded in
# .static-ratchet-baseline.json. Needs Node (npx) and ruff in the gate's venv. The vendored
# front-end libraries under app/webapp/static/vendor/ are third-party copies, so they are
# excluded; the `[vendored]` scripts are left out automatically. Exit 3 (a detector could not
# run) fails the gate.
[static_ratchet]
enabled  = true
baseline = ".static-ratchet-baseline.json"
exclude  = ["app/webapp/static/vendor/**"]

# [docs_ratchet] -- baseline-and-ratchet stage for the README/docs convention: the size of the
# root README.md and the history markers (issue references, dated and changelog headings) in
# README.md and docs/**/*.md. scripts/verify-before-ship.ps1 runs scripts/docs_ratchet.py, which
# fails when either rises above .docs-ratchet-baseline.json. Needs Python 3.11+ (tomllib). Exit 3
# (git unusable, a file that is not UTF-8, a fence or comment that never closes) fails the gate.
[docs_ratchet]
enabled  = true
baseline = ".docs-ratchet-baseline.json"

# [comment_ratchet] -- baseline-and-ratchet stage for issue references in product-code comments
# (Python, JS, CSS, PowerShell): a comment states why the code is the way it is now, history lives in
# the issue and git log. scripts/verify-before-ship.ps1 runs scripts/comment_ratchet.py, which fails
# when a file's `#NNN` count rises above .comment-ratchet-baseline.json. Tests and `[vendored]` files
# are left out automatically. Needs Python 3.11+ (tomllib). Exit 3 (git unusable, a file that cannot
# be scanned) fails the gate.
[comment_ratchet]
enabled  = true
baseline = ".comment-ratchet-baseline.json"

# [conventions_ratchet] -- baseline-and-ratchet stage for fleet conventions held as stdlib `ast`
# rules over the tracked Python files. scripts/verify-before-ship.ps1 runs
# scripts/conventions_ratchet.py, which fails when a file's hit count for a rule rises above
# .conventions-ratchet-baseline.json. Rules on: `no-window` (the tray spawns child processes on
# Windows), `logging-not-print` (app/ and src/ log through `logging`) and `no-drive-path` (no
# hardcoded drive paths). Rules off: `secret-compare` and `git-wrapper`, because this repo has
# neither helper. Needs Python 3.11+ (tomllib). Exit 3 (git unusable, a file that does not parse)
# fails the gate.
[conventions_ratchet]
enabled  = true
baseline = ".conventions-ratchet-baseline.json"
rules    = ["no-window", "logging-not-print", "no-drive-path"]
